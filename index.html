<style id="css">
/* Layout: ledger-style costing sheet. Header strip, two tabs (meals / materials), a meal opens as a costing card. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1B2A2A; --muted:#5E6F6E; --line:#D6DEDC;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --field:#F8FAF9; --warn:#B4540A; --good:#1F7A3E; --bad:#B3261E;
  --font:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1717; --surface:#172221; --ink:#E6EFEE; --muted:#93A5A3; --line:#2A3A39;
  --accent:#4FC1B5; --accent-ink:#06201D; --field:#1D2B2A; --warn:#E9A25B; --good:#6CCB8A; --bad:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1717; --surface:#172221; --ink:#E6EFEE; --muted:#93A5A3; --line:#2A3A39;
  --accent:#4FC1B5; --accent-ink:#06201D; --field:#1D2B2A; --warn:#E9A25B; --good:#6CCB8A; --bad:#F08A82; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
#root{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.status{font-size:.8rem;color:var(--muted);padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.status.dirty{color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{font:inherit;font-weight:600;background:none;border:0;color:var(--muted);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,.link:focus-visible,.in:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h2{font-size:1.1rem;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:.85rem}
.card.set{max-width:640px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .in{width:140px;flex:none}
.sl{display:block;min-width:0}.sh{display:block;font-size:.75rem}
.res{display:flex;justify-content:space-between;padding:10px 0 0;font-weight:600}
.res b{font-variant-numeric:tabular-nums;color:var(--accent)}
.chip{font:inherit;font-size:.85rem;padding:4px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{font:inherit;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:5px}
.in.num{text-align:center;font-variant-numeric:tabular-nums}
.in.bad{border-color:var(--bad)}
select{font:inherit;padding:6px 4px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:5px;max-width:100%}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--field);text-align:right;font-size:.8rem;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center}
.link{font:inherit;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-align:right}
.link:hover{text-decoration:underline}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-size:.78rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.name-in{font-size:1.15rem;font-weight:700}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tot .k{font-size:.78rem;color:var(--muted)}
.tot .v{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.tot.main{border-color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.foot{margin-top:22px;font-size:.8rem;color:var(--muted)}
.printhead{display:none}
@media (max-width:640px){
  .hide-s{display:none}
  .scroll{overflow:visible;border:0;background:none}
  table,tbody{display:block}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px 8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  tbody tr:last-child td{border-bottom:0}
  td{display:block;padding:0;border:0;width:auto!important;text-align:right}
  td.num{text-align:center}
  td:first-child{grid-column:1/-1}
  td[data-label]::before{content:attr(data-label);display:block;font-size:.7rem;color:var(--muted);text-align:right}
  #mealRows tr{grid-template-columns:repeat(2,minmax(0,1fr))}
  #mats tr{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
  #mats td:first-child{grid-column:1/-1}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#999;--field:#fff;--accent:#000}
  .noprint,.tabs,.top .status,.btn,.foot{display:none!important}
  .printhead{display:block;margin-bottom:8px;font-weight:700;font-size:1.1rem}
  .in,select{border:0;background:none;padding:0;appearance:none;-webkit-appearance:none}
  .scroll,.card,.tot{border-color:#999}
}
</style>

function hasSell(me){return me.sell!==null&&me.sell!==''&&Number(me.sell)>0}
function num(x){x=Number(x);return isFinite(x)?x:0}
function oilUnit(){var s=S.settings,q=num(s.perDay)*num(s.days);return q>0?num(s.tanks)*num(s.tankPrice)/q:0}
function oilCost(me){return num(me.oil)*oilUnit()}
function ovhRate(){var s=S.settings;return num(s.sales)>0?num(s.opex)/num(s.sales):0}
function ovhCost(me){return hasSell(me)?num(me.sell)*ovhRate():0}
function grand(me){return mealCost(me)+oilCost(me)+ovhCost(me)}

/* ---------- saving ---------- */
function setStatus(){
  var el=document.getElementById('status');if(!el)return;
  if(standalone){el.textContent=saveErr?'تعذّر الحفظ على هذا الجهاز':'محفوظ على هذا الجهاز';el.className='status'+(saveErr?' dirty':'');return}
  if(!ns){el.textContent='الحفظ غير متاح هنا';el.className='status dirty';return}
  if(saveErr){el.textContent='تعذّر الحفظ';el.className='status dirty';return}
  el.textContent=dirty?'جاري الحفظ…':'محفوظ';el.className='status'+(dirty?' dirty':'');
}
function touch(){
  if(standalone){try{localStorage.setItem(LSK,JSON.stringify(S));saveErr=false}catch(e){saveErr=true}dirty=false;setStatus();return}
  dirty=true;saveErr=false;setStatus();clearTimeout(saveT);saveT=setTimeout(save,1800)}
function buildDoc(){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var st=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
   +TOP+'<style id="css">'+css+'</style>\n<div id="root"></div>\n<script id="state" type="application/json">'+st+'<'+'/script>\n<script id="app">'+app+'<'+'/script></body></html>';
}
function save(){
  if(!ns)return;
  ns.publish(buildDoc()).then(function(){dirty=false;setStatus()}).catch(function(e){dirty=false;saveErr=!(e&&e.code==='conflict');setStatus()});
}

/* ---------- printing (saves a tidy page that opens the print dialog) ---------- */
var dl=null;
function repShell(title,inner){
  return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>@page{size:A4;margin:14mm}body{font:13px Tahoma,Arial,sans-serif;color:#000;margin:0;direction:rtl}h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:0 0 4px}.meta{color:#555;font-size:11px;margin-bottom:10px}table{border-collapse:collapse;width:100%;margin-bottom:10px}th,td{border:1px solid #888;padding:4px 7px;text-align:right}th{background:#eee}.n{text-align:center}.tot td{font-weight:bold;background:#f3f3f3}.rec{break-inside:avoid;margin-bottom:18px}</style></head><body>'+inner+'<script>window.onload=function(){setTimeout(function(){window.print()},400)}<\/script></body></html>';
}
function today(){var d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()}
function mealTable(me,withTitle){
  var h=withTitle?'<div class="rec"><h2>'+esc(me.name)+(me.group?' <span style="font-weight:400;color:#555;font-size:12px">· '+esc(me.group)+'</span>':'')+'</h2>':'';
  h+='<table><thead><tr><th>المادة</th><th class="n">الكمية</th><th class="n">الوحدة</th><th class="n">سعر الوحدة</th><th class="n">التكلفة</th></tr></thead><tbody>';
  me.items.forEach(function(l){
    var m=mat(l.m),u=m?(l.u==='g'&&isKg(m)?'غرام':(m.unit||'')):'';
    h+='<tr><td>'+esc(m?m.name:(l.t||'—'))+(m&&num(m.loss)>0?' (نقص الطبخ '+num(m.loss)+'%)':'')+'</td><td class="n">'+esc(l.q)+'</td><td class="n">'+esc(u)+'</td><td class="n">'+(hasPrice(m)?fmt(effPrice(m)):'—')+'</td><td class="n">'+fmt(lineCost(l))+'</td></tr>';
  });
  var c=mealCost(me),o=oilCost(me),v=ovhCost(me),g=c+o+v,s=num(me.sell);
  h+='<tr class="tot"><td colspan="4">تكلفة المواد</td><td class="n">'+fmt(c)+'</td></tr>';
  if(num(me.oil)>0)h+='<tr class="tot"><td colspan="4">الزيت ('+num(me.oil)+' وحدة)</td><td class="n">'+fmt(o)+'</td></tr>';
  if(hasSell(me))h+='<tr class="tot"><td colspan="4">المصاريف التشغيلية ('+(ovhRate()*100).toFixed(1)+'% من سعر البيع)</td><td class="n">'+fmt(v)+'</td></tr><tr class="tot"><td colspan="4">التكلفة الكلية</td><td class="n">'+fmt(g)+'</td></tr><tr class="tot"><td colspan="4">سعر البيع</td><td class="n">'+fmt(s)+'</td></tr><tr class="tot"><td colspan="4">الربح</td><td class="n">'+fmt(s-g)+'</td></tr><tr class="tot"><td colspan="4">نسبة المواد والزيت</td><td class="n">'+pct(c+o,s)+'</td></tr>';
  else h+='<tr class="tot"><td colspan="4">التكلفة (مواد وزيت، بدون مصاريف تشغيلية)</td><td class="n">'+fmt(c+o)+'</td></tr>';
  return h+'</tbody></table>'+(withTitle?'</div>':'');
}
function shownMeals(){return S.meals.filter(function(me){return (grp==='الكل'||me.group===grp)&&(!mq||me.name.indexOf(mq)>=0)})}
function printReport(kind){
  var title,inner,file;
  if(kind==='meal'){var me=meal(cur);title=me.name;file='تكلفة '+me.name;inner='<h1>'+esc(me.name)+'</h1><div class="meta">'+today()+' · الدينار الأردني</div>'+mealTable(me,false)}
  else if(kind==='recipes'){var ms=shownMeals();title='وصفات الوجبات';file='وصفات الوجبات';inner='<h1>وصفات الوجبات'+(grp!=='الكل'?' · '+esc(grp):'')+'</h1><div class="meta">'+today()+' · الدينار الأردني · '+ms.length+' وجبة</div>'+ms.map(function(m){return mealTable(m,true)}).join('')}
  else if(kind==='mats'){title='المواد والأسعار';file='المواد والأسعار';inner='<h1>المواد والأسعار</h1><div class="meta">'+today()+' · الدينار الأردني</div><table><thead><tr><th>المادة</th><th>الوحدة</th><th class="n">السعر</th><th class="n">نقص الطبخ</th><th class="n">السعر الفعلي</th></tr></thead><tbody>'+S.materials.map(function(m){return '<tr><td>'+esc(m.name)+'</td><td>'+esc(m.unit)+'</td><td class="n">'+(hasPrice(m)?fmt(m.price):'—')+'</td><td class="n">'+(num(m.loss)>0?num(m.loss)+'%':'—')+'</td><td class="n">'+(hasPrice(m)?fmt(effPrice(m)):'—')+'</td></tr>'}).join('')+'</tbody></table>'}
  else{var ms2=shownMeals();title='تكلفة الوجبات';file='تكلفة الوجبات';inner='<h1>تكلفة الوجبات'+(grp!=='الكل'?' · '+esc(grp):'')+'</h1><div class="meta">'+today()+' · الدينار الأردني</div><table><thead><tr><th>الوجبة</th><th class="n">المواد</th><th class="n">الزيت</th><th class="n">المصاريف</th><th class="n">التكلفة الكلية</th><th class="n">سعر البيع</th><th class="n">الربح</th></tr></thead><tbody>'+ms2.map(function(m){var c=mealCost(m),o=oilCost(m),v=ovhCost(m),g=c+o+v,s=num(m.sell);return '<tr><td>'+esc(m.name)+'</td><td class="n">'+fmt(c)+'</td><td class="n">'+fmt(o)+'</td><td class="n">'+(hasSell(m)?fmt(v):'—')+'</td><td class="n">'+fmt(g)+'</td><td class="n">'+(hasSell(m)?fmt(s):'—')+'</td><td class="n">'+(hasSell(m)?fmt(s-g):'—')+'</td></tr>'}).join('')+'</tbody></table><div class="meta">المصاريف التشغيلية = '+(ovhRate()*100).toFixed(1)+'% من سعر البيع، وبتظهر للوجبات اللي إلها سعر بيع.</div>'}
  var st=document.getElementById('status');
  if(!dl&&standalone){var w=window.open('','_blank');if(w){w.document.open();w.document.write(repShell(title,inner));w.document.close()}else if(st){st.textContent='اسمح بالنوافذ المنبثقة عشان تفتح الطباعة';st.className='status dirty'}return}
  if(!dl){if(st){st.textContent='الطباعة غير متاحة هنا';st.className='status dirty'}return}
  dl.save({filename:file.replace(/[\\\/:*?"<>|]/g,' ')+'.html',data:repShell(title,inner)}).then(function(){if(st){st.textContent='افتح الملف المحفوظ وبتظهر نافذة الطباعة';st.className='status'}},function(e){if(st&&e&&e.code!=='declined'){st.textContent='تعذّر تجهيز الطباعة';st.className='status dirty'}});
}

/* ---------- navigation ---------- */
function go(t,id){tab=t;cur=id||null;try{location.hash=t==='meal'?'meal-'+id:t}catch(e){}render()}
function readHash(){
  var h=(location.hash||'').replace('#','');
  if(h==='materials')tab='materials';
  else if(h==='settings')tab='settings';
  else if(h.indexOf('meal-')===0&&meal(h.slice(5))){tab='meal';cur=h.slice(5)}
  else tab='meals';
}

     +'<td class="num" data-label="السعر (JOD)" style="width:150px"><input class="in num" type="text" inputmode="decimal" dir="ltr" data-mf="price" value="'+esc(m.expr?m.expr:(m.price==null?'':m.price))+'" placeholder="بدون سعر" aria-label="السعر">'+(m.expr?'<div class="muted" style="font-size:.72rem" data-k="pv">= '+fmt(m.price)+'</div>':'<div class="muted" style="font-size:.72rem" data-k="pv"></div>')+'</td>'
     +'<td class="num" data-label="نقص الطبخ %" style="width:120px"><input class="in num" type="number" inputmode="decimal" step="1" min="0" max="95" data-mf="loss" value="'+esc(num(m.loss)||'')+'" placeholder="0" aria-label="نقص الطبخ"><div class="muted" style="font-size:.72rem" data-k="eff">'+effText(m)+'</div></td>'
     +'<td class="noprint" style="width:40px"><button class="btn danger small" data-delmat="'+m.id+'" aria-label="حذف المادة">×</button></td></tr>';
  });
  return h+'</tbody></table></div><p class="foot noprint">لو غيّرت سعر مادة، تكلفة كل الوجبات اللي فيها بتتغير لحالها. نقص الطبخ %: الكميات بالوصفات هي وزن بعد الطبخ، والسعر الفعلي = السعر ÷ (1 − النقص). المواد اللي بدون سعر بتنحسب صفر لحد ما تدخل سعرها.</p>';
}
function render(){
  var body=tab==='materials'?materialsView():(tab==='settings'?settingsView():(tab==='meal'?mealView():mealsView()));
  var dl='<datalist id="matlist">'+S.materials.map(function(m){return '<option value="'+esc(m.name)+'">'}).join('')+'</datalist>';
  root.innerHTML=head()+body+dl;
  setStatus();recalc();
}

/* ---------- live numbers ---------- */
function setK(scope,k,txt,cls){var e=scope.querySelector('[data-k="'+k+'"]');if(e){e.textContent=txt;if(cls!==undefined)e.className=(e.className.split(' ').filter(function(c){return c!=='pos'&&c!=='neg'}).join(' ')+' '+cls).trim()}}
function recalc(){
  if(tab==='meals'){
    S.meals.forEach(function(me){
      var tr=root.querySelector('tr[data-id="'+me.id+'"]');if(!tr)return;
      var c=mealCost(me),o=oilCost(me),v=ovhCost(me),g=c+o+v,s=num(me.sell);
      setK(tr,'cost',fmt(c));setK(tr,'oil',num(me.oil)>0?fmt(o):'—');
      setK(tr,'ovh',hasSell(me)?fmt(v):'—');setK(tr,'gtotal',fmt(g));
      setK(tr,'profit',hasSell(me)?fmt(s-g):'—',hasSell(me)?(s-g>=0?'pos':'neg'):'');
      setK(tr,'pct',hasSell(me)?pct(c+o,s):'—');
    });
  }else if(tab==='meal'){
    var me=meal(cur);if(!me)return;
    me.items.forEach(function(l,i){var tr=root.querySelector('tr[data-i="'+i+'"]');if(tr)setK(tr,'lc',fmt(lineCost(l)))});
    var c=mealCost(me),o=oilCost(me),v=ovhCost(me),g=c+o+v,s=num(me.sell);
    setK(root,'total',fmt(c));setK(root,'oil','= '+fmt(o)+' JD');
    setK(root,'ovh',hasSell(me)?fmt(v):'—');setK(root,'gtotal',fmt(g));
    setK(root,'profit',hasSell(me)?fmt(s-g):'—',hasSell(me)?(s-g>=0?'pos':'neg'):'');
    setK(root,'pct',hasSell(me)?pct(c+o,s):'—');
  }else if(tab==='settings'){
    var st=S.settings,om=num(st.tanks)*num(st.tankPrice);
    setK(root,'rate',(ovhRate()*100).toFixed(2)+'%');setK(root,'oilMonth',fmt(om));setK(root,'oilUnit',fmt(oilUnit()));
    setK(root,'oilPct',num(st.sales)>0?(om/num(st.sales)*100).toFixed(1)+'%':'—');
  }
}

/* ---------- events ---------- */
function armed(btn,txt,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';var old=btn.textContent;btn.textContent=txt;
  setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3000);
}
root.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.print){printReport(t.dataset.print);return}
  if(t.dataset.grp){grp=t.dataset.grp;render();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.open){go('meal',t.dataset.open);return}
  var act=t.dataset.act;
  if(act==='addMeal'){
    var inp=document.getElementById('newMeal'),n=(inp.value||'').trim();
    if(!n){inp.focus();return}
    var me={id:uid('w'),group:(grp==='الكل'?'أخرى':grp),name:n,sell:null,items:[]};S.meals.push(me);touch();go('meal',me.id);return}
  if(act==='addLine'){var me=meal(cur);me.items.push({m:null,t:'',q:'',u:'k'});touch();render();
    var ins=root.querySelectorAll('input[data-f="m"]');if(ins.length)ins[ins.length-1].focus();return}
  if(act==='dup'){var me=meal(cur),cp=JSON.parse(JSON.stringify(me));cp.id=uid('w');cp.name=me.name+' (نسخة)';S.meals.push(cp);touch();go('meal',cp.id);return}
  if(act==='delMeal'){armed(t,'تأكيد الحذف؟',function(){S.meals=S.meals.filter(function(x){return x.id!==cur});touch();go('meals')});return}
  if(act==='addMat'){var m={id:uid('m'),name:'',unit:'كيلو',price:null};S.materials.unshift(m);touch();render();
    var f=root.querySelector('tr[data-mid="'+m.id+'"] input');if(f)f.focus();return}
  if(t.dataset.del!==undefined){var me=meal(cur);me.items.splice(Number(t.dataset.del),1);touch();render();return}
  if(t.dataset.delmat){
    var id=t.dataset.delmat,used=S.meals.filter(function(x){return x.items.some(function(l){return l.m===id})});
    if(used.length){t.textContent='مستخدمة';t.title='مستخدمة في: '+used.map(function(x){return x.name}).join('، ');setTimeout(function(){t.textContent='×'},2000);return}
    armed(t,'تأكيد؟',function(){S.materials=S.materials.filter(function(x){return x.id!==id});touch();render()});return}
});
root.addEventListener('input',function(ev){
  var e=ev.target;
  if(e.id==='mealSearch'){mq=e.value.trim();root.querySelectorAll('#mealRows tr').forEach(function(tr){var me=meal(tr.dataset.id);tr.hidden=!((grp==='الكل'||me.group===grp)&&(!mq||me.name.indexOf(mq)>=0))});return}
  if(e.id==='matSearch'){var q=e.value.trim();root.querySelectorAll('#mats tr').forEach(function(tr){var n=tr.querySelector('input').value;tr.hidden=!!q&&n.indexOf(q)<0});return}
  if(e.dataset.set){S.settings[e.dataset.set]=e.value===''?0:Number(e.value);touch();recalc();return}
  if(e.dataset.oil){var mo=meal(e.dataset.oil);mo.oil=e.value===''?0:Number(e.value);touch();recalc();return}
  if(e.dataset.sell){var me=meal(e.dataset.sell);me.sell=e.value===''?null:Number(e.value);touch();recalc();return}
  if(e.id==='mealName'){meal(cur).name=e.value;touch();return}
  if(e.dataset.mf){
    var m=mat(e.closest('tr').dataset.mid),f=e.dataset.mf;
    if(f==='price'){
      var tr0=e.closest('tr'),pv=tr0.querySelector('[data-k="pv"]'),raw=e.value.trim(),ex=safeExpr(raw);
      if(raw===''){m.price=null;m.expr=null;if(pv)pv.textContent=''}
      else if(ex!==null){m.price=ex;m.expr=raw;if(pv)pv.textContent='= '+fmt(ex)}
      else if(isFinite(Number(raw.replace(/،/g,'.')))){m.price=Number(raw.replace(/،/g,'.'));m.expr=null;if(pv)pv.textContent=''}
      else{if(pv)pv.textContent='اكتب رقم أو معادلة'; return}
    }else if(f==='loss'){m.loss=e.value===''?0:Math.max(0,Math.min(95,Number(e.value)))}
    else m[f]=e.value;
    var ef=e.closest('tr').querySelector('[data-k="eff"]');if(ef)ef.textContent=effText(m);
    touch();recalc();return}
  if(e.dataset.f){
    var me=meal(cur),l=me.items[Number(e.dataset.i)];
    if(e.dataset.f==='q')l.q=e.value;
    if(e.dataset.f==='m'){var m=matByName(e.value);l.m=m?m.id:null;l.t=m?'':e.value;if(!m||!isKg(m))l.u='k'}
    touch();recalc()}
});
root.addEventListener('change',function(ev){
  var e=ev.target;
  if(e.dataset.f==='u'){meal(cur).items[Number(e.dataset.i)].u=e.value==='g'?'g':'k';touch();recalc();return}
  if(e.dataset.f==='m'){render();return}
  if(e.dataset.mf==='name'){var dl=document.getElementById('matlist');if(dl)dl.innerHTML=S.materials.map(function(m){return '<option value="'+esc(m.name)+'">'}).join('')}
});
window.addEventListener('hashchange',function(){readHash();render()});

readHash();render();
try{if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(n){ns=n;setStatus()},function(){});window.claude.use('downloads').then(function(n){dl=n},function(){})}}catch(e){}
})();
</script>
